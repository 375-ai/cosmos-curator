# Complete mapping for the reference GpsSample schema in
# core/sensors/schemas/gps.proto. Use this file unchanged for that message, or
# copy it and replace the source paths and units for another protobuf schema.
# The mapping consumer supplies the target row class, so there is no `target`
# entry.
#
# GpsSample is the channel message itself, so this mapping has no `root`.
# The schema's course, speed, climb, and corresponding validity fields are not
# mapped because GpsData does not expose those destinations.

fields:
  # Required source fix timestamp. align_timestamp_ns is omitted intentionally,
  # so it defaults to this mapped sensor timestamp.
  sensor_timestamp_ns:
    from: sensor_timestamp_ns
    type: timestamp
    unit: ns

  # Required WGS-84 position and its per-component validity.
  latitude_deg:
    from: latitude_deg
    type: float
  longitude_deg:
    from: longitude_deg
    type: float
  altitude_m:
    from: altitude_m
    type: float
  position_valid:
    group: [latitude_valid, longitude_valid, altitude_valid]
    type: bool

  # Optional receiver metadata represented by both GpsSample and GpsData.
  # Omitting a matching ``*_valid`` mapping defaults that scalar validity to true.
  # Mapped scalar arrays are present in every sampling window; consult their
  # validity masks before using values.
  satellites_used:
    from: satellites_used
    type: int
  satellites_used_valid:
    from: satellites_used_valid
    type: bool

  horizontal_accuracy_m:
    from: horizontal_accuracy_m
    type: float
  horizontal_accuracy_m_valid:
    from: horizontal_accuracy_m_valid
    type: bool

  vertical_accuracy_m:
    from: vertical_accuracy_m
    type: float
  vertical_accuracy_m_valid:
    from: vertical_accuracy_m_valid
    type: bool

  hdop:
    from: hdop
    type: float
  hdop_valid:
    from: hdop_valid
    type: bool

  vdop:
    from: vdop
    type: float
  vdop_valid:
    from: vdop_valid
    type: bool

  pdop:
    from: pdop
    type: float
  pdop_valid:
    from: pdop_valid
    type: bool

  host_timestamp_ns:
    from: host_timestamp_ns
    type: timestamp
    unit: ns
