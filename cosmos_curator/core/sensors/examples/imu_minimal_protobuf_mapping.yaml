#
# Minimal mapping for producers that provide core ImuSample measurements plus
# optional transport metadata. It intentionally omits validity masks, biases,
# and covariance when those values are not supplied by the producer.
#
# ImuSample is the channel message itself, so this mapping has no `root`.

fields:
  # Required source measurement timestamp. align_timestamp_ns is omitted
  # intentionally, so it defaults to this mapped sensor timestamp.
  sensor_timestamp_ns:
    from: sensor_timestamp_ns
    type: timestamp
    unit: ns

  # Required three-axis measurements. Axis order is x, y, z.
  angular_velocity_rad_s:
    group: [angular_velocity_x_rad_s, angular_velocity_y_rad_s, angular_velocity_z_rad_s]
    type: float
  linear_acceleration_m_s2:
    group: [linear_acceleration_x_m_s2, linear_acceleration_y_m_s2, linear_acceleration_z_m_s2]
    type: float

  # Optional transport metadata.
  host_timestamp_ns:
    from: host_timestamp_ns
    type: timestamp
    unit: ns
  sequence_counter:
    from: sequence_counter
    type: int

  # Optional temperature. Omitting temperature_valid defaults its validity to
  # true whenever temperature_c is mapped.
  temperature_c:
    from: temperature_c
    type: float
