syntax = "proto3";

package cosmos_curator.sensors.gps.v1;

message GpsSample {
  uint64 sensor_timestamp_ns = 1;
  uint64 host_timestamp_ns = 2;

  double latitude_deg = 3;
  double longitude_deg = 4;
  double altitude_m = 5;

  double course_deg = 6;
  double speed_m_s = 7;
  double climb_m_s = 8;

  double hdop = 9;
  double vdop = 10;
  double pdop = 11;
  double horizontal_accuracy_m = 12;
  double vertical_accuracy_m = 13;
  uint32 satellites_used = 14;

  bool latitude_valid = 15;
  bool longitude_valid = 16;
  bool altitude_valid = 17;

  bool course_valid = 18;
  bool speed_valid = 19;
  bool climb_valid = 20;

  bool hdop_valid = 21;
  bool vdop_valid = 22;
  bool pdop_valid = 23;
  bool horizontal_accuracy_m_valid = 24;
  bool vertical_accuracy_m_valid = 25;
  bool satellites_used_valid = 26;
}
