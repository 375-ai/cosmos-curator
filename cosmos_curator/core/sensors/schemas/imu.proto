syntax = "proto3";

package cosmos_curator.sensors.imu.v1;

message ImuSample {
  uint64 sensor_timestamp_ns = 1;
  uint64 host_timestamp_ns = 2;

  double angular_velocity_x_rad_s = 3;
  double angular_velocity_y_rad_s = 4;
  double angular_velocity_z_rad_s = 5;

  double linear_acceleration_x_m_s2 = 6;
  double linear_acceleration_y_m_s2 = 7;
  double linear_acceleration_z_m_s2 = 8;

  bool angular_velocity_x_valid = 9;
  bool angular_velocity_y_valid = 10;
  bool angular_velocity_z_valid = 11;

  bool linear_acceleration_x_valid = 12;
  bool linear_acceleration_y_valid = 13;
  bool linear_acceleration_z_valid = 14;

  uint64 sequence_counter = 15;
  double temperature_c = 16;
  bool temperature_valid = 17;

  double angular_velocity_bias_x_rad_s = 18;
  double angular_velocity_bias_y_rad_s = 19;
  double angular_velocity_bias_z_rad_s = 20;

  bool angular_velocity_bias_x_valid = 21;
  bool angular_velocity_bias_y_valid = 22;
  bool angular_velocity_bias_z_valid = 23;

  double linear_acceleration_bias_x_m_s2 = 24;
  double linear_acceleration_bias_y_m_s2 = 25;
  double linear_acceleration_bias_z_m_s2 = 26;

  bool linear_acceleration_bias_x_valid = 27;
  bool linear_acceleration_bias_y_valid = 28;
  bool linear_acceleration_bias_z_valid = 29;
}
